name: networking_app
description: "Professional networking platform inspired by X architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- LOGIC & STATE MANAGEMENT ---
  get: ^4.6.6
  get_storage: ^2.1.1

  # --- BACKEND (FIREBASE) ---
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6

  # --- UI & DESIGN ASSETS ---
  google_fonts: ^8.0.1
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.10

  # --- DEVICE & UTILITY ---
  image_picker: ^1.1.2
  url_launcher: ^6.2.5
  share_plus: ^12.0.1
  intl: ^0.20.2
  http: ^1.6.0

  flutter_dotenv: ^6.0.0
  google_mobile_ads: ^7.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0

# --- NATIVE SPLASH CONFIGURATION ---
flutter_native_splash:
  color: "#0A66C2"
  image: assets/logo_q.png
  android_12:
    image: assets/logo_q.png
    color: "#0A66C2"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env